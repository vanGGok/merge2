<style>

*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 0,#1b8790 0,#083c47 45%,#041d26 100%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh;display:flex;justify-content:center}

.app{width:min(1160px,100%);padding:18px 14px 28px}.shell{background:linear-gradient(#164f5a,#0b3a46);border:4px solid #3b2416;border-radius:26px;box-shadow:0 22px 70px #0008, inset 0 2px 0 #ffffff22;overflow:hidden}
.topscene{padding:14px 16px 10px;background:linear-gradient(180deg,#3b1f14,#6e3e20 38%,#9a5c31 100%);border-bottom:4px solid #3b2416;position:relative}
.topscene:after{content:"⚓  🏴‍☠️  ⚓";position:absolute;right:20px;top:12px;font-size:30px;opacity:.28}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-family:Georgia,serif;font-size:30px;font-weight:900;color:#ffe8a7;text-shadow:0 3px 0 #522713,0 0 14px #0006}.sub{color:#ffe9bb;font-size:13px;opacity:.9}.timer{background:#2b1a14;color:#ffd777;padding:7px 11px;border-radius:12px;border:2px solid #d79b3d;font-weight:800;white-space:nowrap}
.controls{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border:0;border-radius:12px;background:#203c43;color:#fff;font-size:20px;cursor:pointer;box-shadow:inset 0 2px #ffffff22}.iconbtn:hover{filter:brightness(1.15)}
.scene{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px;margin-top:10px}.pirate{font-size:64px;filter:drop-shadow(0 8px 4px #0006);animation:bob 2.8s ease-in-out infinite}.speech{background:#fff3d0;border:3px solid #3b2416;border-radius:16px;padding:10px 13px;font-weight:800;max-width:620px;box-shadow:0 7px 0 #0002}.speech small{display:block;font-weight:600;opacity:.7;margin-top:2px}
@keyframes bob{50%{transform:translateY(-5px) rotate(-1deg)}}
.content{padding:14px;background:linear-gradient(180deg,#0b424f,#062c37)}
.rail{background:linear-gradient(180deg,#1c5861,#0b3742);border:3px solid #3b2416;border-radius:18px;padding:8px 10px;overflow:hidden}.railhead{display:flex;align-items:center;justify-content:space-between;color:#ffe8b2;font-weight:900;margin-bottom:6px}.railscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px}.railitem{min-width:64px;background:#11292f;border:2px solid #5b412b;border-radius:12px;padding:4px;text-align:center;color:#ffe8b2}.railitem.done{border-color:#58bf76;background:#173a33}.railitem.target{outline:3px solid var(--gold);transform:translateY(-2px)}.railitem .emoji{font-size:26px}.railitem .tier{font-size:11px;font-weight:800}.progress{height:8px;background:#17262a;border-radius:99px;overflow:hidden;margin-top:7px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#53c878,#efc34f);width:0%}
.boardwrap{background:linear-gradient(180deg,#b98043,#7e4d2c);border:4px solid #3b2416;border-radius:22px;margin-top:12px;padding:12px;box-shadow:inset 0 2px 0 #ffffff22}.boardtitle{display:flex;justify-content:space-between;align-items:center;color:#fff0c8;font-weight:900;margin-bottom:8px}.grid{display:grid;gap:7px;margin:auto;max-width:760px}.cell{aspect-ratio:1;border-radius:11px;background:linear-gradient(180deg,#e7d19a,#c9a968);border:3px solid #80603a;box-shadow:inset 0 3px #fff7,0 3px 0 #54331f;display:flex;align-items:center;justify-content:center;position:relative;user-select:none}.cell.empty:hover{filter:brightness(1.08)}.cell.locked{background:repeating-linear-gradient(135deg,#aa793e 0 9px,#8c6232 9px 18px);border-color:#593817}.cell.glass-cell{background:linear-gradient(145deg,#ecfbffcc 0%,#9ee6f055 28%,#3ea7c044 100%);border-color:#b9f5ff;box-shadow:inset 0 0 0 2px #ffffffaa,inset 0 0 18px #8cecff55,inset 0 3px #fff,inset 0 -5px 10px #23677f55,0 3px 0 #54331f;overflow:hidden}.cell.glass-cell:before,.cell.glass-cell:after{content:"";position:absolute;pointer-events:none}.cell.glass-cell:before{inset:8%;border:2px solid #ffffff88;border-radius:9px;transform:rotate(-12deg);opacity:.9}.cell.glass-cell:after{width:70%;height:18%;left:15%;top:8%;background:linear-gradient(90deg,transparent,#fff9,transparent);filter:blur(2px);transform:rotate(-14deg)}.glass-empty{font-size:34px;opacity:.88;filter:drop-shadow(0 2px 0 #ffffff) drop-shadow(0 0 8px #bff7ff)}.cell.locked:after{content:"👑";font-size:28px;filter:drop-shadow(0 2px 0 #332014)}
.item{width:92%;height:92%;border-radius:14px;display:flex;touch-action:none;align-items:center;justify-content:center;font-size:clamp(34px,6vw,54px);position:relative;cursor:grab;transition:transform .12s,filter .12s}.item-image{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;user-select:none;filter:drop-shadow(0 4px 5px rgba(0,0,0,.24))}
.tier-icon-image{width:30px;height:30px;display:block;object-fit:contain;margin:0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));pointer-events:none}
.reward-tier-image{width:44px;height:44px;display:block;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));pointer-events:none}
.reward-item-image{width:28px;height:28px;display:block;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));pointer-events:none}
.pass-stage-image{width:23px;height:23px;display:block;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));pointer-events:none}
.queue-item-image{width:30px;height:30px;display:inline-block;vertical-align:middle;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));pointer-events:none}
.item:active{cursor:grabbing}.item:hover{transform:scale(1.05);filter:brightness(1.07)}.item .tag{position:absolute;right:3px;bottom:1px;background:#2b1c15;color:#ffe29a;border-radius:8px;padding:0 4px;font-size:10px;font-weight:900}.webbed{filter:saturate(.75) brightness(.92)}.webbed:after{content:"🕸️";position:absolute;inset:7px;display:flex;align-items:center;justify-content:center;font-size:19px;opacity:.78}
.item.t1{background:#d8c27f}.item.t2{background:#d2c072}.item.t3{background:#9cc36c}.item.t4{background:#76b5a0}.item.t5{background:#65a6c2}.item.t6{background:#7f94d1}.item.t7{background:#9e83d0}.item.t8{background:#ca7fca}.item.t9{background:#d8738e}.item.t10{background:#e77f68}.item.t11{background:#efb150}.item.t12{background:#ffd95c;box-shadow:0 0 18px #ffdf6577,inset 0 3px #fff9}.cell.box-cell{background:linear-gradient(180deg,#765239,#442b1c);border-color:#2f1d12;box-shadow:inset 0 3px #ffffff15,0 3px 0 #24140d}.item.box-item{background:linear-gradient(145deg,#4b2f1e,#24170f)!important;border:3px solid #1d110b;box-shadow:inset 0 2px #ffffff18,0 4px 0 #160c08}.box-item .box-loot{font-size:clamp(36px,7vw,54px);filter:drop-shadow(0 2px 0 #1e120b)}.box-item .box-mark{position:absolute;left:5px;top:4px;font-size:16px;opacity:.95}.box-item .box-lock{position:absolute;right:5px;top:3px;font-size:12px;opacity:.9}.box-item .tag{right:3px;bottom:2px;background:#24160f;color:#ffe29a}.item.dragging{transform:scale(1.12);filter:brightness(1.12) drop-shadow(0 10px 8px #0008);z-index:30;cursor:grabbing}.grid .cell.drag-target{outline:3px solid #ffe29a;outline-offset:-3px}
.bottom{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;align-items:center;margin-top:12px}.meter,.stagebox,.spawn{background:#18383e;border:3px solid #523725;border-radius:16px;padding:10px;color:#ffe9b7;min-height:76px}.meter b,.stagebox b{font-size:22px}.meter .small,.stagebox .small{font-size:11px;opacity:.72}.spawn{display:flex;align-items:center;justify-content:center;gap:8px;background:#1b754f;border-color:#3e2a19;cursor:pointer;font-weight:900;position:relative}.spawn:hover{filter:brightness(1.06)}.spawn:disabled{filter:grayscale(.6);opacity:.6;cursor:not-allowed}.spawn span:first-child{font-size:30px}.spawn .cost{font-size:12px;background:#133b2d;border-radius:9px;padding:2px 6px}.queue{margin-top:10px;background:#b95c2e;border:3px solid #4b2719;border-radius:14px;color:#ffe9bd;padding:8px 10px;display:none;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}.queue.show{display:flex}.queue .qicon{font-size:28px}.badge{background:#e7ad36;color:#2d1e17;border-radius:999px;padding:2px 7px;font-size:12px;font-weight:900}
.passbtn{position:relative}.passbtn.hot{background:#238659}.passbadge{position:absolute;right:-3px;top:-4px;background:#efc34f;color:#2a1d16;border-radius:999px;font-size:11px;padding:2px 5px;font-weight:900}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.modalcard{width:min(760px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#fff0c8,#e7cc91);border:5px solid #3b2416;border-radius:24px;box-shadow:0 22px 80px #000b;padding:20px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalh{font-family:Georgia,serif;font-size:28px;font-weight:900}.close{border:0;background:#6d3f23;color:#fff;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer}.hero{background:linear-gradient(135deg,#173a43,#0b6570);color:#fff2c7;border:3px solid #3b2416;border-radius:18px;padding:16px;margin:10px 0}.hero .big{font-size:58px;text-align:center}.hero .big img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}.info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.info-grid div{background:#f7e8bf;border:2px solid #9a7443;padding:8px;border-radius:12px;text-align:center;font-weight:800}.claimlist{display:grid;gap:8px;margin-top:10px}.claimrow{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;gap:6px;background:#f6e7bf;border:2px solid #9a7443;border-radius:12px;padding:8px}.claimrow button{border:0;border-radius:10px;padding:8px;background:#2d8a59;color:white;font-weight:900}.claimrow.lock{opacity:.6}.footerbtn{width:100%;border:0;background:#2c8b59;color:white;border-radius:13px;padding:12px;font-size:16px;font-weight:900;margin-top:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:#2c1b14;color:#ffe6a6;border:2px solid #d5a34a;border-radius:14px;padding:11px 15px;font-weight:900;z-index:50;transition:.25s}.toast.show{transform:translate(-50%,0)}
.fly{position:fixed;z-index:40;font-size:26px;pointer-events:none;animation:fly .7s ease-in forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.admin-grid button{border:2px solid #76512f;border-radius:12px;padding:10px 8px;background:#f7e8bf;color:#2a1d16;font-weight:900;cursor:pointer}.admin-grid button:hover{filter:brightness(1.06)}.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.admin-note{font-size:12px;opacity:.75;margin-top:8px}

/* ===== Gameplay feedback / animation layer ===== */
.railitem{position:relative;overflow:hidden;isolation:isolate;transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease,background .28s ease}
.railitem.target{background:linear-gradient(145deg,#4f3f93,#8b5fe7 52%,#d7a63d)!important;border-color:#ffe7a1!important;color:#fff8df;transform:translateY(-3px) scale(1.035);box-shadow:0 0 0 3px rgba(255,221,109,.15),0 8px 22px rgba(255,205,75,.22),inset 0 1px rgba(255,255,255,.35)}
.railitem.target::after{content:"";position:absolute;top:-30%;left:-45%;width:32%;height:160%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);filter:blur(2px);animation:railShine 2.8s ease-in-out infinite;pointer-events:none;z-index:3}
.railitem.just-done{animation:targetDone .65s cubic-bezier(.2,.9,.2,1) both}
.railitem.target-new{animation:targetNew .78s cubic-bezier(.2,.9,.2,1) both}
@keyframes railShine{0%,45%{left:-45%;opacity:0}55%{opacity:1}72%,100%{left:125%;opacity:0}}
@keyframes targetDone{0%{transform:translateY(-3px) scale(1.035);box-shadow:0 0 0 3px rgba(255,221,109,.2),0 0 24px rgba(255,219,105,.4)}45%{transform:translateY(0) scale(1.12);box-shadow:0 0 0 8px rgba(255,229,145,.08),0 0 30px rgba(96,238,186,.45)}100%{transform:translateY(0) scale(1);box-shadow:inset 0 1px rgba(255,255,255,.04)}}
@keyframes targetNew{0%{transform:translateY(10px) scale(.78);opacity:.25;filter:brightness(.8)}45%{transform:translateY(-5px) scale(1.14);opacity:1;filter:brightness(1.35)}100%{transform:translateY(-3px) scale(1.035);filter:none}}
.progress{position:relative}.progress>i{position:relative;overflow:hidden;transition:none}.progress.animate>i{transition:width .85s cubic-bezier(.22,1,.36,1)}
.progress.animate::after{content:"";position:absolute;top:0;left:-25%;width:22%;height:100%;background:linear-gradient(90deg,transparent,#fff8,transparent);filter:blur(1px);animation:progressSweep .85s ease-out forwards;pointer-events:none}
@keyframes progressSweep{to{left:115%;opacity:0}}
.progress.bump>i{animation:progressPulse .8s ease-out}
@keyframes progressPulse{0%{filter:brightness(1)}30%{filter:brightness(1.6)}100%{filter:brightness(1)}}

.cell.merge-ready{outline:3px solid #fff2a4;outline-offset:-3px;box-shadow:inset 0 0 0 2px rgba(255,242,170,.5),0 0 24px rgba(255,211,74,.7),0 0 42px rgba(99,222,255,.22)!important;animation:mergeReadyPulse .65s ease-in-out infinite alternate}
@keyframes mergeReadyPulse{from{filter:brightness(1.08);transform:scale(1.005)}to{filter:brightness(1.24);transform:scale(1.02)}}
.cell.merge-burst{animation:mergeCellBurst .5s cubic-bezier(.18,.8,.25,1) both;z-index:5}
@keyframes mergeCellBurst{0%{transform:scale(.95);filter:brightness(1)}22%{transform:scale(1.08);filter:saturate(1.8) brightness(1.7)}55%{transform:scale(1.03);filter:saturate(1.45) brightness(1.25)}100%{transform:scale(1);filter:none}}
.merge-particle{position:fixed;z-index:95;pointer-events:none;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#fff 0 28%,#ffe27c 30% 55%,#ff8c38 56% 100%);box-shadow:0 0 12px rgba(255,221,96,.9);animation:mergeParticle .58s cubic-bezier(.2,.8,.15,1) forwards}
@keyframes mergeParticle{to{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(var(--rot));opacity:0}}

.spawn{position:relative;overflow:hidden;transform:translateY(0);box-shadow:0 11px 0 rgba(6,89,72,.38),0 17px 28px rgba(24,182,127,.24),inset 0 2px rgba(255,255,255,.28),inset 0 -5px 0 rgba(0,0,0,.10)}
.spawn::before{content:"";position:absolute;inset:2px 8% 58%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.34),transparent);pointer-events:none}
.spawn:hover{transform:translateY(-2px);box-shadow:0 13px 0 rgba(6,89,72,.34),0 20px 32px rgba(24,182,127,.28),inset 0 2px rgba(255,255,255,.30),inset 0 -5px 0 rgba(0,0,0,.10)}
.spawn.spawn-press{animation:spawnPress .34s cubic-bezier(.2,.9,.25,1)}
@keyframes spawnPress{0%{transform:translateY(0) scale(1)}35%{transform:translateY(4px) scale(.96);box-shadow:0 4px 0 rgba(6,89,72,.5),0 7px 12px rgba(24,182,127,.15),inset 0 1px rgba(255,255,255,.16)}75%{transform:translateY(-2px) scale(1.02)}100%{transform:translateY(0) scale(1)}}
.spawn-flyer{position:fixed;z-index:90;width:68px;height:68px;margin:-34px 0 0 -34px;pointer-events:none;animation:spawnFly .58s cubic-bezier(.18,.82,.22,1) forwards}
.spawn-flyer-image{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.42))}
@keyframes spawnFly{
  0%{transform:translate(0,0) scale(.38);opacity:.95}
  42%{transform:translate(calc(var(--tx)*.48),calc(var(--ty)*.28 - 56px)) scale(1.14);opacity:1}
  78%{transform:translate(calc(var(--tx)*.92),calc(var(--ty)*.9 - 8px)) scale(1.04)}
  100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:1}
}
.item-spawning{visibility:hidden!important}
.item-landed{animation:itemLand .24s cubic-bezier(.2,.9,.25,1)}
@keyframes itemLand{0%{transform:scale(.82)}55%{transform:scale(1.1)}100%{transform:scale(1)}}

.passbtn.pass-new{animation:passNew 1.25s cubic-bezier(.2,.9,.2,1)}
.passbtn.pass-tick{animation:passAttention .9s ease-in-out}
.passbadge.pass-badge-new{animation:badgePop .55s cubic-bezier(.18,.9,.25,1)}
.passbadge.pass-badge-shake{animation:badgeShake .7s ease-in-out}
@keyframes passNew{0%{transform:scale(1);filter:brightness(1);box-shadow:0 0 0 0 rgba(76,255,191,0)}28%{transform:scale(1.08);filter:brightness(1.3);box-shadow:0 0 0 8px rgba(70,240,177,.10),0 0 30px rgba(38,211,155,.5)}100%{transform:scale(1);filter:none}}
@keyframes passAttention{0%,100%{transform:translateX(0)}15%{transform:translateX(-4px) rotate(-1deg)}30%{transform:translateX(4px) rotate(1deg)}45%{transform:translateX(-3px)}60%{transform:translateX(2px)}75%{transform:translateX(-1px)} }
@keyframes badgePop{0%{transform:scale(.6);opacity:.2}55%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
@keyframes badgeShake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-3px) rotate(-8deg)}30%{transform:translateX(3px) rotate(8deg)}45%{transform:translateX(-2px) rotate(-5deg)}60%{transform:translateX(2px) rotate(5deg)}75%{transform:translateX(-1px)}}

.boardwrap{position:relative}
.boardwrap.stage-enter{animation:boardStageEnter .65s cubic-bezier(.2,.9,.2,1) both}
.boardwrap.stage-exit{animation:boardStageExit .28s ease-in both}
@keyframes boardStageEnter{0%{opacity:.45;transform:translateY(18px) scale(.96);filter:brightness(.7);box-shadow:0 0 0 rgba(85,220,255,0)}55%{opacity:1;transform:translateY(-4px) scale(1.015);filter:brightness(1.2);box-shadow:0 0 34px rgba(84,221,255,.22)}100%{opacity:1;transform:none;filter:none}}
@keyframes boardStageExit{to{opacity:.2;transform:translateY(-12px) scale(.985);filter:blur(2px)}}
.boardwrap.stage-enter::after{content:"";position:absolute;inset:10%;border-radius:24px;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(152,236,255,.20),transparent 60%);animation:stageGlow .65s ease-out forwards}
@keyframes stageGlow{0%{opacity:0;transform:scale(.7)}35%{opacity:1}100%{opacity:0;transform:scale(1.08)}}

@media (prefers-reduced-motion: reduce){
  .railitem.target::after,.railitem.just-done,.railitem.target-new,.progress.animate>i,.progress.animate::after,.progress.bump>i,.cell.merge-ready,.cell.merge-burst,.merge-particle,.spawn.spawn-press,.spawn-flyer,.item-landed,.passbtn.pass-new,.passbtn.pass-tick,.passbadge.pass-badge-new,.passbadge.pass-badge-shake,.stagebox.stage-new,.stagebox.stage-new::after,.boardwrap.stage-enter,.boardwrap.stage-exit,.boardwrap.stage-enter::after{animation:none!important;transition:none!important}
}

@media(max-width:760px){.bottom{grid-template-columns:1fr}.scene{grid-template-columns:1fr auto}.pirate{font-size:48px}.info-grid{grid-template-columns:repeat(2,1fr)}.title{font-size:24px}.speech{max-width:none}}

/* ===== Modern mobile-game visual pass ===== */
:root{
  --bg0:#071421; --bg1:#0d2235; --panel:#10283a; --panel2:#15364b;
  --line:rgba(255,255,255,.10); --text:#f4f8ff; --muted:#9fb5c9;
  --gold:#ffd35a; --gold2:#ffea9b; --mint:#63e6b0; --cyan:#6de0ff;
  --danger:#ff8b72; --purple:#8e86ff;
}
html{background:#071421}
body{
  background:
    radial-gradient(900px 520px at 50% -12%,rgba(74,211,255,.28),transparent 60%),
    radial-gradient(700px 450px at 10% 35%,rgba(126,96,255,.13),transparent 58%),
    linear-gradient(180deg,#0b2031 0%,#071421 60%,#050d15 100%);
  color:var(--text); padding:0;
}
body:before{opacity:.08;background-size:30px 30px}
.app{width:min(980px,100%);padding:12px}
.shell{
  background:linear-gradient(180deg,rgba(15,38,56,.98),rgba(7,20,32,.98));
  border:1px solid rgba(255,255,255,.10); border-radius:28px;
  box-shadow:0 24px 80px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.10);
}
.topscene{
  padding:14px 16px 15px;
  background:linear-gradient(135deg,#132f45 0%,#0e2538 55%,#122c42 100%);
  border-bottom:1px solid rgba(255,255,255,.09);
}
.topscene:after{content:'⚓';right:22px;top:18px;font-size:42px;opacity:.07}
.brand{align-items:flex-start}
.title{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:24px;letter-spacing:.02em;color:#fff;text-shadow:0 3px 20px rgba(0,0,0,.35)}
.sub{color:#a9c2d7;font-size:12px;margin-top:2px}
.timer{background:rgba(6,15,25,.55);color:var(--gold);padding:8px 11px;border-radius:12px;border:1px solid rgba(255,211,90,.35);box-shadow:inset 0 1px rgba(255,255,255,.06)}
.controls{gap:7px}
.iconbtn{width:40px;height:40px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:rgba(255,255,255,.06);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.10),0 6px 18px rgba(0,0,0,.18)}
.iconbtn:hover{background:rgba(255,255,255,.11);filter:none}
.scene{margin-top:12px}
.speech{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.055));color:#eef7ff;border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:10px 13px;box-shadow:0 8px 20px rgba(0,0,0,.16)}
.speech small{color:#a9bed0}
.pirate{font-size:56px;filter:drop-shadow(0 9px 8px rgba(0,0,0,.45))}
.content{padding:12px;background:linear-gradient(180deg,#081725,#07121e)}
.rail{
  background:linear-gradient(180deg,rgba(20,48,69,.98),rgba(12,33,49,.98));
  border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:10px 11px;
  box-shadow:0 10px 28px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.05)
}
.railhead{color:#eff7ff;margin-bottom:8px}
.railitem{min-width:62px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:5px;color:#c8d9e7;box-shadow:inset 0 1px rgba(255,255,255,.04)}
.railitem.done{border-color:rgba(99,230,176,.45);background:rgba(45,142,104,.17)}
.railitem.target{outline:2px solid var(--gold);box-shadow:0 0 0 5px rgba(255,211,90,.08),0 8px 18px rgba(255,211,90,.10)}
.progress{height:7px;background:rgba(0,0,0,.35);margin-top:9px}
.progress>i{background:linear-gradient(90deg,var(--mint),var(--cyan),var(--gold))}
.boardwrap{
  background:linear-gradient(180deg,#15334a,#0d2538);border:1px solid rgba(255,255,255,.10);border-radius:22px;
  margin-top:12px;padding:12px;box-shadow:0 14px 35px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.06)
}
.boardtitle{color:#eff7ff;margin-bottom:9px}
.boardtitle span:last-child{color:#8fa9bd;font-size:12px}
.grid{gap:8px;max-width:720px;padding:2px}
.cell{
  border-radius:13px;background:linear-gradient(180deg,#d7b979,#a87a3c);border:1px solid rgba(65,37,11,.55);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -8px 15px rgba(67,38,13,.12),0 4px 0 rgba(0,0,0,.18);
  transition:transform .12s,box-shadow .12s,filter .12s
}
.cell.empty{background:linear-gradient(180deg,#b4864a,#8f622f);opacity:.78}
.cell.empty:hover{filter:brightness(1.08)}
.cell.glass-cell{
  background:
    linear-gradient(135deg,rgba(227,250,255,.96),rgba(95,202,239,.30) 32%,rgba(23,92,130,.42) 100%),
    repeating-linear-gradient(120deg,rgba(255,255,255,.14) 0 5px,rgba(255,255,255,.02) 5px 10px);
  border:2px solid #b7f3ff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.62),inset 0 0 20px rgba(88,224,255,.26),0 0 0 2px rgba(89,210,244,.10),0 5px 12px rgba(0,0,0,.22);
}
.cell.glass-cell:before{inset:9%;border:1px solid rgba(255,255,255,.65);border-radius:10px;transform:rotate(-12deg);box-shadow:0 0 12px rgba(189,247,255,.18)}
.cell.glass-cell:after{width:74%;height:20%;left:13%;top:9%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.86),transparent);filter:blur(2px);opacity:.75}
.glass-empty{font-size:31px;filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 0 10px rgba(145,240,255,.65))}
.cell.box-cell{background:linear-gradient(180deg,#3a2a20,#201813);border-color:#5e4433;box-shadow:inset 0 2px rgba(255,255,255,.08),inset 0 -8px 16px rgba(0,0,0,.22),0 5px 0 rgba(0,0,0,.28)}
.item{border-radius:15px;box-shadow:inset 0 1px rgba(255,255,255,.32),0 6px 12px rgba(0,0,0,.18);transition:transform .14s,filter .14s,box-shadow .14s}
.item:hover{transform:scale(1.045);filter:brightness(1.06)}
.item.dragging{visibility:hidden;transform:scale(1.16);filter:brightness(1.1);}
.item.drag-ghost{position:fixed!important;left:0;top:0;margin:0;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.16);filter:brightness(1.12) drop-shadow(0 14px 10px rgba(0,0,0,.45));box-shadow:0 0 0 3px rgba(255,224,120,.55),0 14px 22px rgba(0,0,0,.32);transition:none!important}
.grid .cell.drag-target{outline:3px solid #ffe291;outline-offset:-3px;box-shadow:inset 0 0 0 2px rgba(255,233,160,.32),0 0 18px rgba(255,211,90,.24)}
.bottom{gap:9px}
.meter,.stagebox,.spawn{background:linear-gradient(180deg,#122c3e,#0e2536);border:1px solid rgba(255,255,255,.10);border-radius:17px;box-shadow:0 10px 24px rgba(0,0,0,.20),inset 0 1px rgba(255,255,255,.06)}
.meter,.stagebox{color:#bcd0df}
.meter b,.stagebox b{color:#fff;font-size:22px}
.spawn{background:linear-gradient(135deg,#21b978,#169d8c);border-color:rgba(158,255,214,.35);color:#fff;box-shadow:0 10px 22px rgba(25,188,127,.22),inset 0 1px rgba(255,255,255,.24)}
.spawn:disabled{opacity:.48;filter:none}
.queue{background:linear-gradient(135deg,#c86b36,#a64c2b);border:1px solid rgba(255,208,150,.25);border-radius:16px;color:#fff1d3;box-shadow:0 10px 24px rgba(0,0,0,.20)}
.badge{background:var(--gold);color:#261b0e}
.passbtn{background:linear-gradient(135deg,#304dff,#6952ff)!important;border:1px solid rgba(178,180,255,.34);box-shadow:0 10px 24px rgba(85,76,255,.18)}
.passbtn.hot{background:linear-gradient(135deg,#22c58b,#0eaa93)!important}
.passbadge{background:#fff;color:#3d36a4}
.footerbtn{background:linear-gradient(135deg,#20b77d,#169d8d);box-shadow:0 8px 18px rgba(25,183,125,.18)}
.modal{background:rgba(2,8,15,.76);backdrop-filter:blur(10px)}
.modalcard{background:linear-gradient(180deg,#122d41,#0b1e2d);border:1px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.50);padding:18px;color:#eaf4fb}
.modalh{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff;font-size:26px}
.close{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);color:#fff}
.hero{background:linear-gradient(135deg,#153d55,#10283c);color:#eef8ff;border:1px solid rgba(255,255,255,.10);border-radius:18px}
.info-grid div,.claimrow{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:#e8f4ff}
.claimrow.lock{opacity:.48}
.claimrow button{background:linear-gradient(135deg,#28bd84,#149e8c)}
.toast{bottom:18px;background:rgba(7,17,27,.92);color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 32px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.admin-grid{grid-template-columns:repeat(4,1fr)!important;gap:8px!important}
.admin-grid button{background:linear-gradient(180deg,#1c435d,#122e42)!important;border:1px solid rgba(255,255,255,.10)!important;color:#eff8ff!important;border-radius:13px!important;min-height:58px;box-shadow:inset 0 1px rgba(255,255,255,.06)}
.admin-note{color:#9eb4c7!important}
@media(max-width:760px){
  .app{padding:8px}.shell{border-radius:22px}.topscene{padding:12px}.title{font-size:20px}.sub{font-size:11px}.timer{font-size:12px;padding:7px 9px}.iconbtn{width:36px;height:36px}
  .pirate{font-size:46px}.content{padding:9px}.grid{gap:6px}.cell{border-radius:11px}.item{border-radius:12px}.admin-grid{grid-template-columns:repeat(2,1fr)!important}
  .bottom{grid-template-columns:1fr 1.1fr 1fr;gap:6px}.meter,.stagebox,.spawn{min-height:70px;padding:8px}.meter .small,.stagebox .small{font-size:10px}
}


/* ===== Screenshot-like gameplay layout: left progress / center board / right actions ===== */
.content{
  display:grid;
  grid-template-columns: minmax(92px,118px) minmax(0,1fr) minmax(142px,166px);
  grid-template-rows: auto minmax(0,1fr) auto;
  grid-template-areas:
    "rail board pass"
    "rail board side"
    "rail win side"
    "rail queue side";
  gap:12px;
  align-items:stretch;
}
.content > .rail{grid-area:rail;margin:0;height:100%;min-height:520px;display:flex;flex-direction:column}
.rail .railhead{display:block;text-align:center;font-size:11px;line-height:1.2}
.rail .railhead #goalText{display:block;margin-top:5px;color:var(--gold);font-size:10px}
.railscroll{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;gap:7px;padding:4px 2px 6px;scrollbar-width:thin}
.railitem{min-width:0;width:100%;padding:6px 3px}
.railitem .tier-icon-image{width:30px;height:30px}
.progress{margin-top:7px;flex:0 0 auto}
.content > .boardwrap{grid-area:board;margin:0;align-self:center;width:100%}
.content > .queue{grid-area:queue;margin:0;min-height:52px;align-self:end}
.content > .bottom{grid-area:side;margin:0;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto auto;grid-template-areas:"spawn" "meter" "stage";gap:10px;align-self:end}
.content > .bottom .spawn{grid-area:spawn;min-height:84px;border-radius:24px;flex-direction:column;gap:2px;font-size:13px;position:relative}
.content > .bottom .spawn span:first-child{font-size:38px;line-height:1}
.content > .bottom .spawn .cost{position:absolute;right:8px;top:8px}
.content > .bottom .meter{grid-area:meter;min-height:64px;text-align:center;padding:9px;border-radius:18px}
.content > .bottom .meter .small{display:block;margin-top:1px}
.content > .bottom .meter #winBtn{margin-top:6px!important}
.content > .bottom .stagebox{grid-area:stage;min-height:64px;text-align:center;padding:9px;border-radius:18px}
.stagebox{position:relative;overflow:hidden}
.stagebox.stage-new{animation:stageBoxPulse .9s cubic-bezier(.2,.8,.2,1)}
.stagebox.stage-new::after{content:"";position:absolute;top:0;left:-45%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.62),transparent);transform:skewX(-18deg);filter:blur(1px);animation:stageBoxShine .9s ease-out forwards;pointer-events:none}
@keyframes stageBoxPulse{0%,100%{transform:scale(1);filter:brightness(1);box-shadow:0 10px 24px rgba(0,0,0,.20),inset 0 1px rgba(255,255,255,.06)}25%{transform:scale(1.055);filter:brightness(1.24);box-shadow:0 0 0 4px rgba(255,211,90,.10),0 0 28px rgba(255,211,90,.35),inset 0 1px rgba(255,255,255,.16)}55%{transform:scale(1.025);filter:brightness(1.12);box-shadow:0 0 0 3px rgba(255,211,90,.06),0 0 18px rgba(255,211,90,.22),inset 0 1px rgba(255,255,255,.10)}}
@keyframes stageBoxShine{to{left:125%;opacity:0}}

.content > .bottom .stagebox div{font-size:10px;letter-spacing:.12em}
.content > .bottom .stagebox b{display:block;font-size:24px;line-height:1.05;margin:2px 0}
.pass-slot{grid-area:pass;align-self:start;display:flex}
.pass-slot .passbtn{width:100%;min-height:92px;margin:0;border-radius:24px;padding:12px 10px;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(60,65,255,.20),inset 0 1px rgba(255,255,255,.22)}
.pass-slot .passbadge{right:8px;top:7px}
/* Hide the long instructional bubble/pirate row in the compact gameplay layout; keep header clean like the reference. */
.topscene .scene{display:none}
.topscene{padding:10px 14px 12px}
.brand{justify-content:center;position:relative}
.brand > div:first-child{text-align:center}
.brand .controls{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.title{font-size:25px}
.sub{display:none}
/* Make the board the visual focal point and leave side gutters for actions. */
.boardwrap{box-shadow:0 18px 42px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.07)}
.boardtitle{padding:0 2px}
/* Slightly separate the progression strip from the board visually. */
.rail:after{content:"";display:block;flex:0 0 3px;margin:6px 8px 2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);border-radius:4px}
@media(max-width:820px){
  .content{grid-template-columns:84px minmax(0,1fr) 122px;grid-template-areas:"rail board pass" "rail board side" "rail win side" "rail queue side";gap:8px;padding:8px}
  .content > .rail{min-height:470px}
  .railitem .tier-icon-image{width:27px;height:27px}.railitem .tier{font-size:9px}
  .content > .bottom{gap:7px}
  .content > .bottom .spawn{min-height:76px}.content > .bottom .spawn span:first-child{font-size:32px}
  .pass-slot .passbtn{min-height:82px;font-size:12px}
}
@media(max-width:620px){
  .content{grid-template-columns:72px minmax(0,1fr) 106px;gap:6px}
  .content > .rail{min-height:420px}
  .rail .railhead{font-size:9px}.rail .railhead #goalText{font-size:8px}
  .railitem{padding:4px 2px;border-radius:11px}.railitem .tier-icon-image{width:24px;height:24px}.railitem .tier{font-size:8px}
  .content > .bottom .spawn{min-height:70px;border-radius:19px}.content > .bottom .meter,.content > .bottom .stagebox{border-radius:15px;min-height:58px}
  .content > .bottom .meter #winBtn{font-size:10px;padding:5px!important}
  .title{font-size:20px}.timer{font-size:10px}.iconbtn{width:31px;height:31px;font-size:15px}
}

/* ===== Responsive fit-to-browser =====
   The game keeps the desktop/mobile-game composition and uniformly scales
   the complete interface when the browser viewport is smaller than the
   designed canvas. This prevents horizontal clipping while preserving the
   relative placement of the UI elements. */
html,body{overflow-x:hidden}
.app{width:980px;max-width:none;margin-left:auto;margin-right:auto}
body.fit-mode .app{width:980px;max-width:none}
body.fit-mode .content{grid-template-columns:minmax(92px,118px) minmax(0,1fr) minmax(142px,166px);}
body.fit-mode .content > .rail{min-height:520px}
body.fit-mode .railitem .tier-icon-image{width:30px;height:30px}
body.fit-mode .railitem .tier{font-size:11px}
body.fit-mode .rail .railhead{font-size:11px}
body.fit-mode .rail .railhead #goalText{font-size:10px}
body.fit-mode .content > .bottom{gap:10px}
body.fit-mode .content > .bottom .spawn{min-height:84px}
body.fit-mode .content > .bottom .spawn span:first-child{font-size:38px}
body.fit-mode .content > .bottom .meter,
body.fit-mode .content > .bottom .stagebox{min-height:64px}
body.fit-mode .pass-slot .passbtn{min-height:92px}
body.fit-mode .title{font-size:25px}
body.fit-mode .timer{font-size:13px;padding:8px 11px}
body.fit-mode .iconbtn{width:40px;height:40px;font-size:20px}
body.fit-mode .content > .boardwrap{min-width:0}
body.fit-mode .content > .queue{min-width:0}

/* v19: compact anvil counter + centered level victory block */
.win-counter{grid-area:win;justify-self:center;width:min(460px,100%);display:flex;align-items:center;justify-content:center;gap:12px;margin:0;min-height:62px;padding:8px 10px;background:linear-gradient(180deg,#173b52,#10293b);border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:0 12px 28px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.08)}
.win-counter #winBtn{border:0;border-radius:13px;padding:11px 18px;background:linear-gradient(135deg,#f2c94c,#e7a929);color:#2a1d16;font-weight:950;font-size:14px;line-height:1;cursor:pointer;box-shadow:0 7px 16px rgba(225,174,43,.22),inset 0 1px rgba(255,255,255,.45);white-space:nowrap}
.win-counter #winBtn:hover{filter:brightness(1.07)}
.win-counter-stat{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:center;column-gap:5px;min-width:92px;padding:5px 10px;border-left:1px solid rgba(255,255,255,.12);color:#fff}
.win-counter-stat>span:first-child{grid-row:1/3;font-size:27px;line-height:1}
.win-counter-stat>span:nth-child(2){font-size:20px;font-weight:950;line-height:1}
.win-counter-stat small{font-size:9px;color:#9fb6c7;line-height:1.1}
.anvil-count{display:flex;align-items:center;justify-content:center;gap:7px;min-height:54px}
.anvil-count span{font-size:43px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.28))}
.anvil-count b{font-size:27px;color:#fff;font-weight:950;line-height:1}
.content > .bottom .meter{text-align:center;padding:7px 9px;min-height:64px}
.content > .bottom .meter .small{display:none}
.content > .bottom .meter #winBtn{margin-top:0!important;width:auto}
@media(max-width:760px){
  .win-counter{width:min(100%,460px);min-height:58px;padding:7px 8px;gap:8px}
  .win-counter #winBtn{font-size:13px;padding:10px 14px}
  .win-counter-stat{min-width:84px;padding:4px 8px}
  .win-counter-stat>span:first-child{font-size:24px}
  .win-counter-stat>span:nth-child(2){font-size:18px}
  .anvil-count span{font-size:38px}.anvil-count b{font-size:24px}
}

body.fit-mode .queue>div{min-width:0}
body.fit-mode .queue>div:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.fit-mode .queue>div:last-child{display:flex;align-items:center;gap:6px;flex:0 0 auto}
@supports not (zoom: 1){
  body.fit-mode .app{transform:scale(var(--ui-scale,1));transform-origin:top center}
}


/* ===== Rewards map + 3-column pass redesign ===== */
.modalcard:has(.reward-map-wrap),
.modalcard:has(.pass-hero){width:min(920px,100%);}

/* Reward map: vertical mobile-game style */
.reward-map-wrap{margin-top:8px;color:var(--text,#f4f8ff)}
.reward-map-head{padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#173b55,#10283b);border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px rgba(255,255,255,.08),0 10px 22px rgba(0,0,0,.18);font-size:14px;font-weight:900;text-align:center;color:#f5fbff;position:sticky;top:0;z-index:4}
.reward-map{position:relative;margin:12px auto 0;padding:12px 10px 18px;display:flex;flex-direction:column;gap:9px;max-height:66vh;overflow:auto;scrollbar-width:thin}
.reward-map:before{content:"";position:absolute;left:50%;top:18px;bottom:116px;width:4px;transform:translateX(-50%);border-radius:99px;background:linear-gradient(0deg,#6de0ff 0%,#8e86ff 48%,#ffd35a 100%);box-shadow:0 0 14px rgba(109,224,255,.22),0 0 20px rgba(142,134,255,.14);opacity:.75}
.reward-node{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1fr);gap:10px;align-items:center;min-height:86px}
.reward-node:after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border-radius:50%;background:#1a3447;border:3px solid #75e4ff;box-shadow:0 0 0 4px rgba(109,224,255,.08),0 0 16px rgba(109,224,255,.35);z-index:2}
.reward-side{min-height:56px;padding:9px 11px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px rgba(255,255,255,.05),0 8px 18px rgba(0,0,0,.12);position:relative}
.reward-side:first-child{text-align:right}
.reward-side.empty{visibility:hidden}
.reward-name{font-weight:900;color:#f6fbff;font-size:12px;line-height:1.25}
.reward-sub{font-size:10px;color:#8faec4;margin-top:3px}
.reward-dot{position:relative;z-index:3;width:88px;height:88px;margin:auto;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#1f4a61,#172e42);border:2px solid rgba(255,255,255,.12);box-shadow:0 12px 24px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.12)}
.reward-dot .reward-tier-image{width:44px;height:44px;line-height:1}
.reward-dot .tier{font-size:11px;font-weight:900;color:#bcd3e4;margin-top:4px}
.reward-status{font-size:9px;font-weight:900;color:#7f9bb0;margin-top:2px}
.reward-node.done .reward-dot{border-color:rgba(99,230,176,.55);background:linear-gradient(145deg,#1c604f,#183b3a);box-shadow:0 0 0 4px rgba(99,230,176,.07),0 12px 26px rgba(20,164,116,.18),inset 0 1px rgba(255,255,255,.12)}
.reward-node.done .reward-status{color:#63e6b0}
.reward-node.target .reward-dot{border-color:#ffe08a;background:linear-gradient(145deg,#594f2b,#4f347d 55%,#263b59);box-shadow:0 0 0 5px rgba(255,211,90,.09),0 0 28px rgba(255,211,90,.28),inset 0 1px rgba(255,255,255,.16);animation:rewardTargetPulse 2s ease-in-out infinite}
.reward-node.target .reward-status{color:#ffd35a}
.reward-node.locked .reward-dot{filter:saturate(.6);opacity:.68}
.reward-node.locked .reward-side{opacity:.58}

/* ===== v24: unified board + independent item sizing ===== */
/* The board is one stable surface. Items sit on top of it and never form/move their own cells. */
.grid{position:relative;isolation:isolate}
.grid .cell{
  /* Every ordinary board cell is identical; only glass and closed-box cells are exceptions. */
  background:linear-gradient(180deg,#c8a86d,#a77a3e)!important;
  border:1px solid rgba(65,37,11,.55)!important;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -8px 15px rgba(67,38,13,.12),0 4px 0 rgba(0,0,0,.18)!important;
  opacity:1!important;
  overflow:visible;
}
.grid .cell.empty{background:linear-gradient(180deg,#c8a86d,#a77a3e)!important;opacity:1!important}
.grid .cell.glass-cell{
  background:
    linear-gradient(135deg,rgba(239,252,255,.98),rgba(137,226,248,.38) 34%,rgba(52,135,170,.34) 100%),
    repeating-linear-gradient(120deg,rgba(255,255,255,.16) 0 5px,rgba(255,255,255,.025) 5px 10px)!important;
  border:2px solid #b7f3ff!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.68),inset 0 0 20px rgba(88,224,255,.28),0 0 0 2px rgba(89,210,244,.10),0 5px 12px rgba(0,0,0,.22)!important;
}
.grid .cell.box-cell{
  background:linear-gradient(180deg,#3a2a20,#201813)!important;
  border-color:#5e4433!important;
  box-shadow:inset 0 2px rgba(255,255,255,.08),inset 0 -8px 16px rgba(0,0,0,.22),0 5px 0 rgba(0,0,0,.28)!important;
}

/* Board item: transparent PNG, deliberately smaller than the cell so there is a visible gutter. */
.grid .item:not(.box-item){
  width:82%!important;
  height:82%!important;
  margin:auto!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
  border:0!important;
  padding:0!important;
  font-size:0!important;
}
.grid .item:not(.box-item):hover{transform:scale(1.055);filter:brightness(1.06)!important}
.grid .item:not(.box-item).dragging{visibility:hidden;transform:none!important;filter:none!important}
.grid .item:not(.box-item) .item-image{
  width:100%!important;height:100%!important;object-fit:contain!important;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.30)) drop-shadow(0 1px 1px rgba(255,255,255,.14));
}
.grid .item:not(.box-item).webbed .item-image{filter:saturate(.76) brightness(.92) drop-shadow(0 5px 5px rgba(0,0,0,.28))}

/* Separate settings for every interface location. */
.railitem .tier-icon-image{
  width:42px!important;height:42px!important;object-fit:contain!important;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.30));
}
.reward-dot .reward-tier-image{
  width:58px!important;height:58px!important;object-fit:contain!important;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.34));
}
.reward-chip .reward-item-image{
  width:38px!important;height:38px!important;object-fit:contain!important;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.30));
}
.pass-stage .pass-stage-image{
  width:42px!important;height:42px!important;object-fit:contain!important;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.30));
}
.queue .queue-item-image{width:34px!important;height:34px!important}

/* No tier captions in the three item progression/reward interfaces. */
.railitem .tier,.reward-dot .tier,.pass-stage>span:not(.stage-icon){display:none!important}
.railitem{min-height:56px;display:flex;align-items:center;justify-content:center}
.reward-dot{width:78px!important;height:78px!important}
.pass-stage{min-height:58px!important;padding:4px!important}

/* Keep the board layout stable while dragging: the cell itself is never hidden or resized. */
.grid .cell{flex:0 0 auto;min-width:0;min-height:0}
.grid .cell>.item{position:relative;z-index:2}
.grid .cell.drag-target{transform:none!important}

@media(max-width:820px){
  .railitem .tier-icon-image{width:36px!important;height:36px!important}
  .reward-dot{width:70px!important;height:70px!important}
  .reward-dot .reward-tier-image{width:52px!important;height:52px!important}
  .pass-stage .pass-stage-image{width:38px!important;height:38px!important}
}
@media(max-width:620px){
  .grid .item:not(.box-item){width:80%!important;height:80%!important}
  .railitem .tier-icon-image{width:32px!important;height:32px!important}
  .reward-dot{width:62px!important;height:62px!important}
  .reward-dot .reward-tier-image{width:47px!important;height:47px!important}
  .reward-chip .reward-item-image{width:34px!important;height:34px!important}
  .pass-stage .pass-stage-image{width:34px!important;height:34px!important}
}

/* ===== v25: Piratika UI cleanup / test controls / hammer slots / larger pass ===== */
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
html,body,*{font-family:'Roboto',Arial,sans-serif!important}
.title,.modalh{font-family:'Roboto',Arial,sans-serif!important}

/* Event timer is removed from the interface. */
.timer{display:none!important}

/* Reward-chain label and goal label are intentionally hidden; the chain remains. */
.railhead,#goalText{display:none!important}
.rail{padding-top:8px}

/* Stage is a compact 1/12 counter. */
.stagebox{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px!important}
.stagebox>div{font-size:10px!important;letter-spacing:.10em;font-weight:900}
.stagebox #stageNum{font-size:24px!important;line-height:1}
.stagebox .small{display:none!important}

/* Dedicated hammer-image slots. Put hammer.png next to item_t*.png later. */
.hammer-slot{display:inline-block;position:relative;flex:0 0 auto;overflow:hidden}
.hammer-slot::before{content:"PNG";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,.28);border-radius:inherit;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:rgba(255,255,255,.50);font-size:8px;font-weight:900;letter-spacing:.04em}
.hammer-slot.has-image::before{display:none}
.hammer-slot-main{width:54px;height:54px;border-radius:14px}
.hammer-slot-small{width:30px;height:30px;border-radius:9px}
.hammer-slot-test{width:27px;height:27px;border-radius:8px}
.hammer-slot-main::before{font-size:9px}
.hammer-slot-small::before,.hammer-slot-test::before{font-size:7px}

/* The real image can be supplied as hammer.png on GitHub/local assets. */
.hammer-slot::after{content:"";position:absolute;inset:0;background-image:url('https://raw.githubusercontent.com/vanGGok/merge2/main/assets/images/hammer.png'),url('./assets/images/hammer.png');background-size:contain,contain;background-repeat:no-repeat,no-repeat;background-position:center,center;display:block;pointer-events:none}

.spawn{gap:0!important;padding:8px!important}
.spawn .hammer-slot-main{filter:drop-shadow(0 6px 7px rgba(0,0,0,.28))}
.anvil-count{gap:7px!important}
.anvil-count .hammer-slot-small{filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}

/* Testing-only controls live outside the game shell. */
body{flex-direction:column;align-items:center}
.app{width:min(980px,100%)}
#testPanel{flex:0 0 auto;width:min(460px,calc(100% - 24px));margin:0 auto 18px;grid-area:auto}

/* Larger, wider pass window and more readable contents. */
.modalcard:has(.pass-reward-list){width:min(1120px,calc(100vw - 24px));max-width:calc(100vw - 24px);max-height:92vh;padding:22px}
.modalcard:has(.pass-reward-list) .modalh{font-size:30px}
.modalcard:has(.pass-reward-list) #modalBody{width:100%;min-width:0}
.pass-reward-list{gap:8px!important;margin-top:12px!important}
.pass-stage{min-height:64px!important;padding:6px!important}
.pass-stage .pass-stage-image{width:52px!important;height:52px!important;filter:drop-shadow(0 6px 8px rgba(0,0,0,.34))}
.passrow{min-height:290px!important;padding:8px!important;gap:7px!important}
.pass-task{min-height:58px!important;padding:7px!important}
.pt-icon{width:40px!important;height:40px!important}
.pass-col{min-height:96px!important;padding:8px!important}
.pass-gift{min-height:96px!important;padding:9px 7px!important}
.pass-gift-icon{font-size:36px!important}
.pass-gift-amount{font-size:14px!important}
.pass-gift button{font-size:10px!important;padding:7px 4px!important}
.pass-buy{gap:12px!important;margin-top:12px!important;padding-top:12px!important}
.pass-price-note{color:#91a8ba;font-size:12px;font-weight:700}
.pass-buy .pass-price-button{font-size:18px!important;padding:12px 14px!important}

@media(max-width:760px){
  .modalcard:has(.pass-reward-list){width:calc(100vw - 12px);max-width:calc(100vw - 12px);padding:15px}
  .pass-stage .pass-stage-image{width:46px!important;height:46px!important}

  .pass-gift-icon{font-size:28px!important}

<body>
<div class="app"><div class="shell">

    <div class="scene"><div><div class="speech" id="speech">Два одинаковых сокровища — и получим предмет следующего тира!<small>Собери цепочку до главного сундука.</small></div></div><div class="pirate">🏴‍☠️</div></div>

</div></div><div class="toast" id="toast"></div>
<script>
const stages=[
 {goal:2,w:5,h:5,newField:true,rewards:[]},
 {goal:3,w:5,h:5,newField:false,rewards:[]},
 {goal:4,w:5,h:5,newField:false,rewards:[]},
 {goal:5,w:5,h:5,newField:false,rewards:[]},
 {goal:6,w:5,h:5,newField:false,rewards:[]},
 {goal:7,w:5,h:5,newField:false,rewards:[['💡','Лампочка x1']]},
 {goal:8,w:5,h:5,newField:true,rewards:[['🧽','Ластик x1']]},
 {goal:9,w:5,h:6,newField:true,rewards:[['📏','Линейка x1']]},
 {goal:10,w:5,h:6,newField:true,rewards:[['💡','Лампочка x1'],['📏','Линейка x1']]},
 {goal:11,w:6,h:6,newField:true,rewards:[['🪙','Золото x250'],['🧽','Ластик x1'],['💡','Лампочка x1']]},
 {goal:12,w:6,h:6,newField:true,rewards:[['🪙','Золото x500'],['💡','Лампочка x1'],['📏','Линейка x1'],['🧽','Ластик x1'],['🪄','Жезл x1'],['♾️','Бесконечная жизнь x12']]}
];

const passSteps=[
 {t:4,free:1,premium:2},{t:5,free:1,premium:3},{t:6,free:1,premium:5},{t:7,free:1,premium:10},
 {t:8,free:2,premium:15},{t:9,free:2,premium:25},{t:10,free:2,premium:40},{t:11,free:5,premium:50}
];

// PNG предметов из публичного репозитория:
// https://github.com/vanGGok/merge2/tree/main/assets/images
const ITEM_ASSET_BASE='https://raw.githubusercontent.com/vanGGok/merge2/main/assets/images/';
const ITEM_ASSET_LOCAL='./assets/images/';
const ITEM_ASSET_PREFIX='item_t';
const ITEM_ASSET_EXT='.png';
function itemSrc(t){ return `${ITEM_ASSET_BASE}${ITEM_ASSET_PREFIX}${t}${ITEM_ASSET_EXT}`; }
function itemLocalSrc(t){ return `${ITEM_ASSET_LOCAL}${ITEM_ASSET_PREFIX}${t}${ITEM_ASSET_EXT}`; }
function itemImg(t,className='item-image'){
  return `<img class="${className}" src="${itemSrc(t)}" alt="T${t}" draggable="false" loading="eager" onerror="if(this.dataset.fb)return;this.dataset.fb=1;this.src='${itemLocalSrc(t)}'">`;
}
const UI_ASSET_BASE='https://raw.githubusercontent.com/vanGGok/merge2/main/assets/images/';
const UI_ASSET_LOCAL='./assets/images/';
function uiLogo(file,className,alt){
  const remote=UI_ASSET_BASE+file, local=UI_ASSET_LOCAL+file;
  return `<img class="${className}" src="${remote}" alt="${alt||''}" draggable="false" loading="eager" onerror="if(this.dataset.fb)return;this.dataset.fb=1;this.src='${local}'">`;
}
const icons=['🪙','💰','💎','🧭','🏺','🗝️','💍','👑','🦜','⚔️','🔱','🗃️'];
const boxIcon='📦';
let stage=1,currency=2,grid=[],queue=[],claimed={free:[],premium:[]},premium=false;
let nextAnvilId=1;
const spentAnvilIds=new Set();
let target=2;
// Пропуск открывается только за фактически впервые созданный тир.
const discoveredTiers=new Set();
let dragState={from:null,pointerId:null,startX:0,startY:0,offsetX:0,offsetY:0,active:false,justDragged:false,ghost:null};
let mergeHover={cell:null,timer:null};
let lastPassCount=0;
const $=id=>document.getElementById(id);
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function tierClass(t){return 't'+t}
function icon(t){return icons[t-1]||'✨'}
function boxTier(it){return it&&it.box ? it.box : null}

/*
 Balance source: m2_start_fields.
 box_item_tN = a closed box containing item_tN_webbed.
 item_tN_webbed = an item of tier N under glass/webbing.
 Blank cells remain blank.
*/
const balancedFields={
  1:{
    w:5,h:5,
    cells:[
      ['b1','b1','b6','b1','b1'],
      ['b1','b2','b1','b2','b1'],
      ['b1','w1','w1','w1','b1'],
      ['w1',null,null,null,'w1'],
      [null,null,null,null,null]
    ]
  },
  7:{
    w:5,h:5,
    cells:[
      [null,null,null,null,null],
      [null,'w1',null,'w1',null],
      ['w1','b1','w2','b1','w1'],
      ['b1','b2','b1','b2','b1'],
      ['b1','b2','b1','b6','b1']
    ]
  },
  8:{
    w:5,h:6,
    cells:[
      ['b1','b7','b1','b2','b1'],
      ['b2','b1','b2','b4','b2'],
      ['w1','b1','b2','b1','w1'],
      [null,'w1','b1','w1',null],
      [null,null,'w1',null,null],
      [null,null,null,null,null]
    ]
  },
  9:{
    w:5,h:6,
    cells:[
      [null,null,'w1','b1','b2'],
      [null,null,'w2','b1','b1'],
      [null,'w1','b4','b4','b7'],
      [null,'w2','b1','b1','b2'],
      [null,null,'w2','b4','b7'],
      [null,null,'w1','b2','b2']
    ]
  },
  10:{
    w:6,h:6,
    cells:[
      ['b8','b6','b4','b1','b2', 'b1'],
      ['b6','b8','b2','b6','w4','w1'],
      ['b4','b3','b4','w2',null,null],
      ['b1','b6','w2','w1',null,null],
      ['b2','w4',null,null,null,null],
      ['b1','w1',null,null,null,null]
    ]
  },
  11:{
    w:6,h:6,
    cells:[
      ['b2','b8','b9','b4','b2','b8'],
      ['b4','b6','b2','b8','b7','b4'],
      ['b6','b4','w6','w4','b6','b4'],
      ['b2','w1',null,null,'w1','b2'],
      ['w2',null,null,null,null,'w2'],
      ['w1',null,null,null,null,'w1']
    ]
  }
};

function itemFromCode(code){
  if(!code) return null;
  const kind=code[0], t=Number(code.slice(1));
  if(kind==='b') return {t,web:false,box:t};
  if(kind==='w') return {t,web:true,box:null};
  return null;
}
function fieldForStage(n){
  if(balancedFields[n]) return balancedFields[n];
  const keys=Object.keys(balancedFields).map(Number).filter(k=>k<=n).sort((a,b)=>b-a);
  return keys.length?balancedFields[keys[0]]:null;
}
function initialItems(){
  const s=stages[stage-1], field=fieldForStage(stage);
  let a=Array(s.w*s.h).fill(null);
  if(!field) return a;
  for(let r=0;r<field.h;r++){
    for(let c=0;c<field.w;c++){
      a[r*field.w+c]=itemFromCode(field.cells[r]?.[c]);
    }
  }
  return a;
}
function isBlocked(i){
  return false; // The balance uses boxes/webbing, not decorative locked cells.
}
function bottomFirstEmptyIndex(){
  const s=stages[stage-1];
  for(let r=s.h-1;r>=0;r--){
    for(let c=0;c<s.w;c++){
      const i=r*s.w+c;
      if(!grid[i]) return i;
    }
  }
  return -1;
}
function isMovableItem(it){
  return !!it && !it.box && !it.web && !it.spawning;
}
function moveItem(from,to){
  if(from===to||!grid[from]||grid[to]) return false;
  if(!isMovableItem(grid[from])) return false;
  grid[to]=grid[from];
  grid[from]=null;
  selected=null;
  render();
  return true;
}
function render(){
  const s=stages[stage-1];
  $('stageNum').textContent=`${stage}/12`;
  $('currency').textContent=currency;
  const spentEl=$('spentAnvils'); if(spentEl) spentEl.textContent=spentAnvilIds.size;
  const rail=$('rail');rail.innerHTML='';
  // Цепочка визуально идёт снизу вверх: T1 внизу, текущая/следующие цели выше.
  for(let t=12;t>=1;t--){
    const d=document.createElement('div');
    d.className='railitem '+(t<s.goal?'done ':'')+(t===s.goal?'target':'');
    d.dataset.tier=String(t);
    d.setAttribute('role','button');
    d.tabIndex=0;
    d.innerHTML=`<div class="tier-icon">${itemImg(t,'tier-icon-image')}</div>`;
    d.addEventListener('click',()=>openRewardMap(t));
    d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openRewardMap(t)}});    
    rail.appendChild(d)
  }
  const progressPct=((s.goal-1)/11*100)+'%';
  $('progressBar').style.width=progressPct;
  $('grid').style.gridTemplateColumns=`repeat(${s.w},1fr)`;$('grid').innerHTML='';
  grid.forEach((it,i)=>{
    const c=document.createElement('div');
    c.className='cell '+(it?'':'empty')+(it?.box?' box-cell':'')+(it?.web?' glass-cell':'');
    c.dataset.index=String(i);
    c.addEventListener('dragover',e=>e.preventDefault());
    if(it){
      const el=document.createElement('div');
      el.className=`item ${tierClass(it.t)} ${it.web?'webbed ':''}${it.box?'box-item':''}`;
      el.dataset.index=i;
      if(it.box){
        el.draggable=false;
        el.innerHTML='';
        el.title=`Закрытая коробка с ${icon(it.box)} T${it.box}. Откроется после соседнего merge со стеклом.`;
      }else{
        el.draggable=false;
        el.innerHTML=itemImg(it.t);
        if(it.spawning)el.classList.add('item-spawning');
        attachPointerDrag(el,i);
      }
      c.appendChild(el);
    }
    c.addEventListener('click',()=>{
      if(dragState.justDragged){dragState.justDragged=false;return;}
      if(!it && selected!==null){moveItem(selected,i);return}
      if(it && isMovableItem(it))selectItem(i);
    });
    $('grid').appendChild(c)
  });
  $('spawn').disabled=currency<1 || queue.length>0 || grid.every(x=>x!==null);
  $('queue').classList.toggle('show',queue.length>0);
  $('queueCount').textContent=queue.length;
  $('queueItem').innerHTML=queue[0]?(queue[0].box?boxIcon:itemImg(queue[0].t,'queue-item-image')):'—';
  const passCount=availablePassRewards();
  $('passBadge').textContent=passCount;
  $('passBtn').classList.toggle('hot',passCount>0);
  if(passCount>lastPassCount){
    const btn=$('passBtn'), badge=$('passBadge');
    btn.classList.remove('pass-new');badge.classList.remove('pass-badge-new');
    void btn.offsetWidth; void badge.offsetWidth;
    btn.classList.add('pass-new');badge.classList.add('pass-badge-new');
    setTimeout(()=>{btn.classList.remove('pass-new');badge.classList.remove('pass-badge-new')},1400);
  }
  lastPassCount=passCount;
}
function attachPointerDrag(el,index){
  const cleanupGhost=()=>{
    if(dragState.ghost){dragState.ghost.remove();dragState.ghost=null;}
  };
  const updateGhost=(x,y)=>{
    if(!dragState.ghost)return;
    dragState.ghost.style.left=(x-dragState.offsetX)+'px';
    dragState.ghost.style.top=(y-dragState.offsetY)+'px';
  };
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0||!isMovableItem(grid[index]))return;
    const rect=el.getBoundingClientRect();
    dragState={
      from:index,
      pointerId:e.pointerId,
      startX:e.clientX,
      startY:e.clientY,
      offsetX:e.clientX-(rect.left+rect.width/2),
      offsetY:e.clientY-(rect.top+rect.height/2),
      active:false,
      justDragged:false,
      ghost:null
    };
    el.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(dragState.from!==index||dragState.pointerId!==e.pointerId)return;
    const dist=Math.hypot(e.clientX-dragState.startX,e.clientY-dragState.startY);
    if(!dragState.active && dist<6)return;
    if(!dragState.active){
      dragState.active=true;
      const rect=el.getBoundingClientRect();
      const ghost=el.cloneNode(true);
      ghost.classList.remove('dragging');
      ghost.classList.add('drag-ghost');
      ghost.style.width=rect.width+'px';
      ghost.style.height=rect.height+'px';
      ghost.style.fontSize=getComputedStyle(el).fontSize;
      document.body.appendChild(ghost);
      dragState.ghost=ghost;
      el.classList.add('dragging');
    }
    updateGhost(e.clientX,e.clientY);
    const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');
    document.querySelectorAll('.cell.drag-target').forEach(x=>x.classList.remove('drag-target'));
    if(cell && cell.parentElement===$('grid')){
      cell.classList.add('drag-target');
      armMergeHover(cell,dragState.from);
    }else{
      clearMergeHover();
    }
    e.preventDefault();
  });
  const finish=e=>{
    if(dragState.from!==index||dragState.pointerId!==e.pointerId)return;
    const wasActive=dragState.active;
    const from=dragState.from;
    const ghost=dragState.ghost;
    if(wasActive)updateGhost(e.clientX,e.clientY);
    el.classList.remove('dragging');
    cleanupGhost();
    clearMergeHover();
    document.querySelectorAll('.cell.drag-target').forEach(x=>x.classList.remove('drag-target'));
    let targetCell=null;
    if(wasActive)targetCell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');
    if(wasActive && targetCell && targetCell.parentElement===$('grid')){
      const to=Number(targetCell.dataset.index);
      if(Number.isInteger(to) && to!==from){
        if(!grid[to])moveItem(from,to);
        else merge(from,to);
      }
    }
    dragState.justDragged=wasActive;
    if(wasActive)setTimeout(()=>dragState.justDragged=false,0);
    dragState={from:null,pointerId:null,startX:0,startY:0,offsetX:0,offsetY:0,active:false,justDragged:dragState.justDragged,ghost:null};
    try{el.releasePointerCapture?.(e.pointerId)}catch{}
  };
  el.addEventListener('pointerup',finish);
  el.addEventListener('pointercancel',finish);
};
function clearMergeHover(){
  if(mergeHover.timer){clearTimeout(mergeHover.timer);mergeHover.timer=null;}
  if(mergeHover.cell){mergeHover.cell.classList.remove('merge-ready');}
  mergeHover.cell=null;
}
function armMergeHover(cell,fromIndex){
  if(!cell){clearMergeHover();return;}
  const to=Number(cell.dataset.index);
  if(!Number.isInteger(to)||to===fromIndex||!grid[fromIndex]||!grid[to]){clearMergeHover();return;}
  const A=grid[fromIndex],B=grid[to];
  const valid=A && B && !A.box && !B.box && A.t===B.t && A.t<12 && !(A.web&&B.web);
  if(!valid){clearMergeHover();return;}
  if(mergeHover.cell===cell && mergeHover.timer)return;
  clearMergeHover();
  mergeHover.cell=cell;
  mergeHover.timer=setTimeout(()=>{
    if(mergeHover.cell===cell){cell.classList.add('merge-ready');mergeHover.timer=null;}
  },500);
}

function revealAdjacentBoxes(sourceIndex){
  const s=stages[stage-1], w=s.w, h=s.h;
  const r=Math.floor(sourceIndex/w), c=sourceIndex%w;
  const neighbors=[[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
  let revealed=0;
  for(const [nr,nc] of neighbors){
    if(nr<0||nr>=h||nc<0||nc>=w)continue;
    const i=nr*w+nc, it=grid[i];
    if(it&&it.box){
      grid[i]={t:it.box,web:true,box:null};
      revealed++;
      setTimeout(()=>sparkAtCell(i),0);
    }
  }
  if(revealed) toast(`🕸️ Открыто стеклом: ${revealed}`);
}
let selected=null;
function selectItem(i){
  if(!grid[i]||!isMovableItem(grid[i]))return;
  if(selected===null){selected=i;toast('Выбери свободную клетку или такой же предмет');return}
  if(selected===i){selected=null;return}
  if(!grid[i]){moveItem(selected,i);return}
  merge(selected,i);selected=null;
}
function merge(a,b){
  if(a===b||!grid[a]||!grid[b])return;
  const A=grid[a],B=grid[b];
  if(A.box||B.box){toast('📦 Сначала открой коробку');return}
  if(A.t!==B.t){toast('Нужны два предмета одного тира');return}
  if(A.t>=12){toast('Это максимальный тир');return}
  if(A.web&&B.web){toast('Нельзя объединить два предмета под стеклом');return}
  clearMergeHover();
  const t=A.t;
  const sourceAnvils=[...(A.anvilIds||[]),...(B.anvilIds||[])];
  sourceAnvils.forEach(id=>spentAnvilIds.add(id));
  const mergedAnvilIds=[...new Set(sourceAnvils)];
  // Результат остаётся на клетке, куда был заведен второй предмет.
  const resultIndex=b;
  const glassIndex=B.web?b:(A.web?a:null);
  const resultTier=t+1;
  grid[a]=null;
  grid[b]=null;
  grid[resultIndex]={t:resultTier,web:false,box:null,anvilIds:mergedAnvilIds};
  discoveredTiers.add(resultTier);

  // Целевой предмет НЕ удаляется: после выполнения таска он остаётся на поле
  // и переносится на следующий этап вместе с остальными предметами.
  const completedTarget=(resultTier===target);

  if(glassIndex!==null)revealAdjacentBoxes(glassIndex);
  render();
  setTimeout(()=>playMergeEffect(resultIndex),20);

  if(completedTarget)newTargetReward(resultTier);
}
function playMergeEffect(index){
  const cell=$('grid').children[index];
  if(!cell)return;
  cell.classList.remove('merge-burst');
  void cell.offsetWidth;
  cell.classList.add('merge-burst');
  const r=cell.getBoundingClientRect();
  const count=18;
  for(let n=0;n<count;n++){
    const p=document.createElement('span');
    p.className='merge-particle';
    p.style.left=(r.left+r.width/2-4)+'px';
    p.style.top=(r.top+r.height/2-4)+'px';
    const angle=(Math.PI*2*n/count)+(Math.random()-.5)*.35;
    const dist=30+Math.random()*72;
    p.style.setProperty('--dx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--dy',Math.sin(angle)*dist+'px');
    p.style.setProperty('--rot',(Math.random()*260-130)+'deg');
    const size=(6+Math.random()*6)+'px';p.style.width=size;p.style.height=size;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),650);
  }
  setTimeout(()=>cell.classList.remove('merge-burst'),560);
}

function fillFromQueue(){

function animateChainTargetSwap(previousTier,nextTier){
  const prev=document.querySelector(`.railitem[data-tier="${previousTier}"]`);
  const next=document.querySelector(`.railitem[data-tier="${nextTier}"]`);
  if(prev)prev.classList.add('just-done');
  if(next)next.classList.add('target-new');
  const bar=$('progressBar'), progress=bar?.parentElement;
  if(progress){
    const oldPct=((previousTier-1)/11*100)+'%';
    const newPct=((nextTier-1)/11*100)+'%';
    bar.style.width=oldPct;
    progress.classList.remove('animate','bump');
    void bar.offsetWidth;
    progress.classList.add('animate','bump');
    requestAnimationFrame(()=>{bar.style.width=newPct});
    setTimeout(()=>progress.classList.remove('animate','bump'),1000);
  }
  setTimeout(()=>prev?.classList.remove('just-done'),750);
  setTimeout(()=>next?.classList.remove('target-new'),900);
}

function advanceStage(){
  if(stage>=stages.length)return;
  const previousStage=stage;
  const previousTarget=target;
  const next=stages[stage];
  if(!next.newField){
    stage++;
    target=next.goal;
    render();
    animateChainTargetSwap(previousTarget,target);
    return;
  }

  // 1. Собираем весь остаток со старого поля в очередь.
  const carry=grid.filter(Boolean).map(cloneItem);
  queue=queue.concat(carry);
  // 2. Очищаем старую сетку.
  grid=Array(stages[previousStage-1].w*stages[previousStage-1].h).fill(null);
  render();

  // 3. Загружаем новое поле после очистки.
  setTimeout(()=>{
    stage++;
    target=next.goal;
    grid=initialItems();
    render();
    animateChainTargetSwap(previousTarget,target);

    // 4. Переносим очередь по свободным клеткам снизу вверх.
    setTimeout(()=>{
      const placed=fillFromQueue();
      render();
      if(queue.length)toast(`📦 Перенесено: ${placed}. В очереди осталось: ${queue.length}`);
    },220);
  },420);
}

      el.classList.remove('item-spawning');
      el.classList.add('item-landed');
      setTimeout(()=>el.classList.remove('item-landed'),260);
    }
  });
});
$('queue').addEventListener('click',()=>{
  if(!queue.length)return;
  const i=bottomFirstEmptyIndex();
  if(i<0){toast('Освободи клетку для остатка');return}
  grid[i]=queue.shift();render()
});
$('passBtn').addEventListener('click',openPass);
$('adminBtn').addEventListener('click',openAdmin);
$('infoBtn').addEventListener('click',openInfo);
$('modalClose').addEventListener('click',closeModal);
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
$('closeBtn').addEventListener('click',()=>toast('В демо выход оставлен на этом экране'));
setInterval(()=>{
  const count=availablePassRewards();
  if(count>0){
    const btn=$('passBtn'), badge=$('passBadge');
    btn.classList.remove('pass-tick');badge.classList.remove('pass-badge-shake');
    void btn.offsetWidth;void badge.offsetWidth;
    btn.classList.add('pass-tick');badge.classList.add('pass-badge-shake');
    setTimeout(()=>{btn.classList.remove('pass-tick');badge.classList.remove('pass-badge-shake')},850);
  }
},10000);

grid=initialItems();render();

// Fit the complete game canvas to the browser viewport. We scale the whole
// interface only when necessary, so desktop screens keep the intended size.
(function(){
  const app=document.querySelector('.app');
  if(!app)return;
  let raf=0;
  function fitGame(){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const vv=window.visualViewport;
      const vw=(vv&&vv.width)||window.innerWidth;
      const vh=(vv&&vv.height)||window.innerHeight;
      document.body.classList.add('fit-mode');

      // Reset zoom before measuring the designed canvas.
      app.style.zoom='1';
      app.style.transform='none';
      document.documentElement.style.setProperty('--ui-scale','1');

      const baseW=Math.max(980,app.offsetWidth);
      const baseH=Math.max(1,app.offsetHeight);
      const availableW=Math.max(260,vw-16);
      const availableH=Math.max(260,vh-16);
      const scale=Math.min(1,availableW/baseW,availableH/baseH);
      const safeScale=Math.max(0.5,scale);

      document.documentElement.style.setProperty('--ui-scale',String(safeScale));
      if('zoom' in app.style){
        app.style.zoom=safeScale;
      }else{
        app.style.transform=`scale(${safeScale})`;
        app.style.transformOrigin='top center';
      }
    });
  }
  window.addEventListener('resize',fitGame,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',fitGame,{passive:true});
  window.addEventListener('orientationchange',()=>setTimeout(fitGame,80),{passive:true});
  fitGame();
})();
</script>
